# Free security scans on every PR, every push to the default branch, and weekly
# on a timer (a timer catches advisories published against code that has not
# changed). Guide: docs/security-setup.md, step 3.
#
# Actions are pinned to commit SHAs, never floating tags: a tag can be moved to
# malicious code, a SHA cannot. Dependabot (github-actions ecosystem) proposes
# the bumps. Scanner binaries are installed from checksum-verified release
# assets at a pinned version (bump V by hand). The trigger is `pull_request`,
# never `pull_request_target`: that one runs with write access and secrets
# while checking out the PR author's code.
#
# Each scanner is its own job, so one scanner's failure never stops another
# from running. The dependency scanners tell FINDINGS apart from SCANNER
# ERRORS: both fail the job, with distinct messages, so a scanner outage is
# never mistaken for a clean scan.
#
# The npm jobs run only when package-lock.json exists at the repo root, and
# say so in a notice when it does not. Move or remove that check if your
# lockfile lives elsewhere. They read the Node version from .nvmrc, and fail
# with a message saying so when it is missing.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1" # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum-verified release binary)
        # Download OUTSIDE the checkout: a PR controls the checkout and could
        # commit a symlink named like a download target for curl to write through.
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          V=8.30.1
          B="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -fsSLO "${B}/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "${B}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Use the base branch's gitleaks config and ignores, not the PR's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # gitleaks reads .gitleaks.toml and .gitleaksignore from the checkout,
          # which on a pull_request is the PR author's tree. A PR could add a
          # global allowlist, or an empty config with no rules, and pass the
          # scan with a live secret. So the scan uses the BASE branch's copies
          # (already reviewed and merged), written to a directory OUTSIDE the
          # checkout and passed by explicit path. Nothing is written through a
          # checkout path: the PR controls those, and a symlink there would
          # redirect the write. The checkout's copies are then deleted (rm on a
          # symlink removes the link, not its target).
          # A real false positive is suppressed by merging the .gitleaksignore
          # entry first, in its own reviewed PR. If you add a .gitleaks.toml,
          # keep it self-contained: an `[extend] path` pointing into the
          # checkout would read a file the PR controls.
          T="$RUNNER_TEMP/gitleaks-trusted"
          mkdir -p "$T"
          : > "$T/gitleaksignore"
          ARGS="--gitleaks-ignore-path=$T/gitleaksignore"
          for f in .gitleaks.toml .gitleaksignore; do
            # Accept only a regular file in the base tree, never a symlink.
            mode=$(git ls-tree "$BASE" -- "$f" | cut -d' ' -f1)
            base_blob=""
            case "$mode" in
              100644|100755) base_blob=$(git rev-parse "${BASE}:${f}") ;;
            esac
            head_blob=$(git rev-parse -q --verify "HEAD:${f}" 2>/dev/null || true)
            if [ "$head_blob" != "$base_blob" ]; then
              echo "::warning title=gitleaks::this PR changes $f; scanning with the base branch's copy instead (suppressions are not accepted from a pull request)"
            fi
            if [ -n "$base_blob" ]; then
              case "$f" in
                .gitleaks.toml)
                  git cat-file blob "$base_blob" > "$T/gitleaks.toml"
                  ARGS="$ARGS --config=$T/gitleaks.toml" ;;
                .gitleaksignore)
                  git cat-file blob "$base_blob" > "$T/gitleaksignore" ;;
              esac
            fi
            rm -rf -- "$f"
          done
          echo "GITLEAKS_TRUSTED_ARGS=$ARGS" >> "$GITHUB_ENV"
      - name: Scan the commits this event introduced (full history on the timer)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # gitleaks builds `git log -p -U0 <log-opts>`, and a NON-EMPTY
          # --log-opts replaces its own defaults
          # (--full-history --all --diff-filter=tuxdb). Neither its default nor
          # a custom value passes --diff-merges, so `git log -p` omits
          # merge-commit patches: a secret added while resolving a merge
          # conflict would go unscanned. Every path below therefore asks for
          # first-parent merge diffs, and the full-history paths restate the
          # defaults rather than losing them, with one deliberate change: no `t`.
          # In --diff-filter a LOWERCASE letter EXCLUDES that change type, so
          # gitleaks' default `tuxdb` skips type changes. A symlink replaced by a
          # regular file holding a secret is a type change (T), and the full
          # scan never read it. Measured with gitleaks 8.30.1: `tuxdb` reported
          # "no leaks found" on such a commit, `uxdb` reported the leaks. The
          # pull_request and push ranges pass no --diff-filter, so git's
          # default already includes T there.
          # --text is LOAD-BEARING. Without it a PR can add `path -diff` to
          # .gitattributes, git prints "Binary files differ" instead of the
          # patch, and gitleaks scans nothing while reporting "no leaks found".
          # Do not remove --text.
          DIFFOPTS="--diff-merges=first-parent --text"
          FULL="--full-history --all --diff-filter=uxdb $DIFFOPTS"
          case "$GITHUB_EVENT_NAME" in
            pull_request) OPTS="$BASE..$HEAD $DIFFOPTS" ;;
            push)
              case "$BEFORE" in
                # Branch just created: there is no previous head to diff from,
                # so scan everything rather than an arbitrary recent slice.
                0000000000000000000000000000000000000000) OPTS="$FULL" ;;
                *)
                  # A force-push can leave $BEFORE unreachable even at
                  # fetch-depth 0. Passing it to gitleaks then FAILS the job
                  # instead of scanning, so fall back to a FULL scan rather
                  # than a recent slice that could skip older commits.
                  if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                    OPTS="$BEFORE..$GITHUB_SHA $DIFFOPTS"
                  else
                    echo "::warning title=gitleaks::previous head $BEFORE is unreachable (history rewritten); scanning the full history instead"
                    OPTS="$FULL"
                  fi ;;
              esac ;;
            *) OPTS="$FULL" ;;
          esac
          # --ignore-gitleaks-allow: a `gitleaks:allow` comment in a PR must not
          # be able to suppress a finding. GITLEAKS_TRUSTED_ARGS (pull requests
          # only) points gitleaks at the base branch's config and ignore file.
          # shellcheck disable=SC2086  # deliberate: space-separated flag list
          gitleaks git --redact --no-banner -v --ignore-gitleaks-allow ${GITLEAKS_TRUSTED_ARGS:-} --log-opts="$OPTS"

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner 2.7.0 (checksum-verified release binary)
        # Download OUTSIDE the checkout: a PR controls the checkout and could
        # commit a symlink named like a download target for curl to write through.
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          V=2.7.0
          B="https://github.com/google/osv-scanner/releases/download/v${V}"
          curl -fsSLO "${B}/osv-scanner_linux_amd64"
          curl -fsSLO "${B}/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          sudo install -m 0755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Use a trusted, empty osv-scanner configuration
        run: |
          set -eu
          # osv-scanner loads an osv-scanner.toml found beside any scanned
          # manifest. A pull request controls this checkout, so it could add
          # [[PackageOverrides]] ignore = true or [[IgnoredVulns]] and hide a
          # vulnerable dependency while the job still reports clean. Same rule
          # as the gitleaks job: suppressions are not accepted from a pull
          # request. --config with this empty file, outside the checkout,
          # replaces the per-directory lookup, so no osv-scanner.toml in the
          # checkout is read. If you need a reviewed ignore, put it here.
          : > "$RUNNER_TEMP/osv-scanner-trusted.toml"
      # osv-scanner 2.7.0 does not read pyproject.toml. A Python project whose
      # dependencies live only there would get a green scan with zero Python
      # packages checked. So copy its declared dependencies into a requirements
      # file OUTSIDE the checkout, which the scan below adds with -L and
      # resolves transitively. Root pyproject.toml only; change the path if
      # yours is elsewhere. Known limit: a spec with an upper bound
      # (`pkg>=3.1,<3.3`) may be reported as unscannable rather than resolved.
      - name: List pyproject.toml dependencies for the scan
        run: |
          set -eu
          if [ ! -f pyproject.toml ]; then
            echo "no pyproject.toml at the repo root; nothing to list"
            exit 0
          fi
          # -I (isolated mode): the working directory is the PR's checkout, and
          # without it a PR-added tomllib.py would be imported in place of the
          # standard library and could hide dependencies from the scan.
          python3 -I - "$RUNNER_TEMP/pyproject-requirements.txt" <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          project = data.get("project", {})
          deps = list(project.get("dependencies", []))
          for extra in project.get("optional-dependencies", {}).values():
              deps += extra
          for group in data.get("dependency-groups", {}).values():
              deps += [d for d in group if isinstance(d, str)]
          if not deps:
              print("::warning title=osv-scanner::pyproject.toml declares no static dependencies "
                    "(dynamic ones are not read); its Python packages are not scanned")
          with open(sys.argv[1], "w", encoding="utf-8") as out:
              out.write("".join(d + "\n" for d in deps))
          print(f"{len(deps)} pyproject.toml dependencies listed for the scan")
          PY
      # osv-scanner exit codes: 0 clean, 1 vulnerabilities found, anything else
      # is a scanner error (bad flag, no packages found, network) and must never
      # look like a findings result.
      #
      # Known limit of the transitive resolver (requirements.txt and the
      # pyproject.toml list above are resolved through deps.dev): it can fail
      # on a fully pinned closure that includes Windows-only packages
      # (seen: `pywin32 311.0.0 not found`, a scanner error), and it can pick
      # stale versions for unpinned specs. If your repo hits that, add
      # --no-resolve to scan only the versions you declare, and say why in a
      # comment. EdgeMesh does this, to be revisited by 2026-12-11.
      - name: osv-scanner over every lockfile and manifest
        run: |
          set -u
          # GitHub runs this under `bash -e`: capture the exit code instead of
          # letting a non-zero scanner result end the step before it is classified.
          rc=0
          # The default plugin set is `lockfile, sbom, directory`. Naming
          # plugins REPLACES the default list, so all four are listed.
          # `github/actions` only INVENTORIES workflow `uses:` references: it
          # does NOT detect advisories against them. Tested with osv-scanner
          # 2.7.0: tj-actions/changed-files (GHSA-mrrh-fwg8-r2c3) at v44.5.7,
          # by tag and by SHA, and actions/download-artifact v4.1.2
          # (GHSA-cxww-7g56-2vh6) all scanned as "No issues found". The
          # zizmor job below is the actions advisory check.
          # --no-ignore: a pull request can add .gitignore rules that hide
          # tracked manifests or workflows from a recursive scan.
          # -L adds the pyproject.toml dependencies listed by the step above.
          extra=()
          if [ -s "$RUNNER_TEMP/pyproject-requirements.txt" ]; then
            extra=(-L "requirements.txt:$RUNNER_TEMP/pyproject-requirements.txt")
          fi
          osv-scanner scan source --recursive --no-ignore \
            --config "$RUNNER_TEMP/osv-scanner-trusted.toml" ./ \
            "${extra[@]}" \
            --x-plugins lockfile --x-plugins sbom --x-plugins directory \
            --x-plugins github/actions || rc=$?
          case "$rc" in
            0) echo "osv-scanner: no known vulnerabilities" ;;
            1)
              echo "::error title=osv-scanner::known vulnerabilities found"
              exit 1 ;;
            *)
              echo "::error title=osv-scanner::scanner error, exit $rc (not a findings result)"
              exit "$rc" ;;
          esac

  # Advisories against the actions your workflows use. Neither osv-scanner (see
  # above) nor Dependabot covers a SHA-pinned action, so zizmor does: it maps a
  # SHA pin to its release tag and checks that version against the GitHub
  # Advisory Database. The job fails on three audits only, so zizmor's other
  # (style and hardening) findings never turn a PR red:
  #   known-vulnerable-actions  an action version with a published advisory
  #   impostor-commit           a SHA pin that is not in the action's own repo
  #                             (a commit from a fork, served under its name)
  #   unpinned-uses             an action not pinned to a full commit SHA
  # A SHA that no release tag points at cannot be mapped to a version, so no
  # advisory could match it; the job's pin step fails on such a pin. The last
  # step covers the advisories zizmor cannot see (reusable workflows,
  # sub-action paths, renamed repositories).
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.32.0 (digest-verified release binary)
        # Download OUTSIDE the checkout: a PR controls the checkout and could
        # commit a symlink named like a download target for curl to write through.
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          V=1.32.0
          F="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/v${V}/${F}"
          # This release publishes no checksums file, so the asset's digest
          # (as GitHub lists it for the release) is recorded here.
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  ${F}" | sha256sum -c -
          tar -xzf "${F}" zizmor
          sudo install -m 0755 zizmor /usr/local/bin/zizmor
          zizmor --version
      # zizmor's online audits need a token; without one it silently runs
      # offline and skips the advisory lookup, so a missing token is an error.
      # The job token is read-only (`contents: read`) and is enough: the
      # advisory database and the actions' tags are public.
      # --no-config and --no-ignores: a pull request controls the checkout, so
      # it could add a zizmor.yml that disables an audit, or a
      # `# zizmor: ignore[...]` comment. Neither is honoured.
      # --collect=all: also audit workflows a PR hides with .gitignore.
      # --ignore-lockfile: zizmor skips `unpinned-uses` for any workflow listed
      # in .github/workflows/actions.lock, while `known-vulnerable-actions`
      # still reads the `uses:` ref, not the locked commit the runner checks
      # out. (Hidden, experimental flag in 1.32.0: if a later version drops it,
      # zizmor exits non-zero and the step fails as a scanner error.)
      # --strict-collection: a collected file zizmor cannot parse fails the
      # scan instead of being skipped with a warning.
      # --no-exit-codes: exit 0 means the scan ran, anything else is a scanner
      # error; the JSON decides whether there are findings.
      - name: zizmor (known-vulnerable, impostor and unpinned actions)
        # Explicit, so a workflow-level `defaults.run.working-directory` cannot
        # point the scan at a clean subdirectory.
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=zizmor::scanner error: no GitHub token, so the advisory lookup cannot run (not a findings result)"
            exit 2
          fi
          # zizmor also reads switches from the environment, and a workflow-
          # or job-level `env:` reaches this step: ZIZMOR_OFFLINE or
          # ZIZMOR_NO_ONLINE_AUDITS would skip the advisory and impostor
          # audits while the job stays green, and GH_HOST would send the token
          # to another host. Unset them, keep only the job token, and name the
          # host on the command line (it outranks the environment).
          unset ZIZMOR_OFFLINE ZIZMOR_NO_ONLINE_AUDITS GITHUB_TOKEN ZIZMOR_GITHUB_TOKEN
          out="$RUNNER_TEMP/zizmor.json"
          rc=0
          zizmor --format json --no-progress --no-exit-codes --strict-collection \
            --no-config --no-ignores --collect=all --ignore-lockfile \
            --gh-hostname github.com . > "$out" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=zizmor::scanner error, exit $rc (not a findings result)"
            exit 2
          fi
          # -I (isolated mode): the working directory is the PR's checkout, and
          # without it a PR-added json.py would be imported in place of the
          # standard library and could report no findings.
          python3 -I - "$out" <<'PY'
          import json, sys
          GATED = {"known-vulnerable-actions", "impostor-commit", "unpinned-uses"}
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  findings = json.load(fh)
              if not isinstance(findings, list):
                  raise ValueError(f"expected a list, got {type(findings).__name__}")
          except (OSError, ValueError) as exc:
              print(f"::error title=zizmor::scanner error: unreadable output ({exc}); not a findings result")
              sys.exit(2)
          def esc(s):
              # Workflow-command escaping: the text comes from the PR's files.
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          hits = 0
          for f in findings:
              ident = f.get("ident", "")
              if ident not in GATED:
                  continue
              hits += 1
              loc = (f.get("locations") or [{}])[0]
              key = loc.get("symbolic", {}).get("key", {})
              local = key.get("Local", {}) if isinstance(key, dict) else {}
              path = local.get("given_path") or local.get("verbatim_path") or "?"
              path = path[2:] if path.startswith("./") else path
              row = loc.get("concrete", {}).get("location", {}).get("start_point", {}).get("row")
              line = f",line={row + 1}" if isinstance(row, int) else ""
              note = loc.get("symbolic", {}).get("annotation", "")
              feature = loc.get("concrete", {}).get("feature", "").strip()
              path = esc(path).replace(",", "%2C").replace(":", "%3A")
              print(f"::error file={path}{line},title=zizmor {esc(ident)}::{esc(f.get('desc', ''))}: {esc(note)} ({esc(feature)})")
          print(f"zizmor: {len(findings)} findings in total, {hits} in the gated audits")
          sys.exit(1 if hits else 0)
          PY
      # known-vulnerable-actions matches advisories by release tag. A SHA pin
      # that no tag of the action's repository points at cannot be matched to
      # any advisory, so it would pass that audit unchecked (unpinned-uses and
      # impostor-commit both accept it). So every SHA pin of an external action
      # must be a commit that one of its repository's RELEASE tags points at. Runs even
      # when the zizmor step failed, so both results show.
      - name: Every action SHA pin is a tagged release
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}  # see the zizmor step
        env:
          # Read-only job token, so the tag lookup also works for this
          # repository's own reusable workflows when it is private. Passed to
          # git through GIT_CONFIG_* environment variables, never argv.
          GH_TOKEN: ${{ github.token }}
        run: |
          # -I: see the zizmor step; the working directory is the PR's checkout.
          # Each file is PARSED (yq, preinstalled on GitHub's Ubuntu runners,
          # with anchors expanded) and every `uses` value anywhere in it is
          # checked, so quoted keys, flow mappings and folded scalars cannot
          # hide a pin the way they could from a line-based match.
          python3 -I - <<'PY'
          import json, os, re, subprocess, sys

          def esc(s):
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def prop(s):
              # An annotation property (file=) also ends at a comma or colon.
              return esc(s).replace(",", "%2C").replace(":", "%3A")

          def uses_values(doc):
              # Only the keys that select an action or reusable workflow:
              # jobs.<id>.uses, jobs.<id>.steps[*].uses, and runs.steps[*].uses
              # in an action.yml, plus the steps of a `parallel:` group at any
              # depth. A `uses` inside a step's `with:` is an input.
              def step_uses(steps):
                  for s in steps if isinstance(steps, list) else []:
                      if not isinstance(s, dict):
                          continue
                      if isinstance(s.get("uses"), str):
                          yield s["uses"].strip()
                      yield from step_uses(s.get("parallel"))
              if not isinstance(doc, dict):
                  return
              jobs = doc.get("jobs")
              for job in (jobs.values() if isinstance(jobs, dict) else []):
                  if isinstance(job, dict):
                      if isinstance(job.get("uses"), str):
                          yield job["uses"].strip()
                      yield from step_uses(job.get("steps"))
              runs = doc.get("runs")
              if isinstance(runs, dict):
                  yield from step_uses(runs.get("steps"))

          # With .github/workflows/actions.lock the runner checks out the
          # LOCKED commit of each action, which neither this step nor zizmor's
          # advisory audit reads (both check the `uses:` ref). Fail closed until
          # this check audits locked commits.
          lockfile = ".github/workflows/actions.lock"
          if os.path.lexists(lockfile):
              print(f"::error file={prop(lockfile)},title=action pins::{lockfile} is a workflow lockfile. The runner executes its locked commits, which this check and zizmor's advisory audit do not read, so the lockfile is not supported here.")
              sys.exit(1)
          files = []
          for root, dirs, names in os.walk(".", followlinks=False):
              dirs[:] = [d for d in dirs if d != ".git"]
              for d in dirs:
                  # os.walk does not enter a symlinked directory, so a symlinked
                  # .github (or anything under it), or a symlinked directory
                  # holding an action.yml, would hide manifests: fail closed.
                  dp = os.path.join(root, d)[2:]
                  if os.path.islink(dp) and (dp.replace(os.sep, "/").split("/")[0] == ".github"
                                             or any(os.path.exists(os.path.join(dp, m)) for m in ("action.yml", "action.yaml"))):
                      print(f"::error file={prop(dp)},title=action pins::{esc(dp)} is a symlinked directory; workflows and actions must be regular files to be checked")
                      sys.exit(1)
              for n in names:
                  p = os.path.join(root, n)[2:]
                  low = n.lower()
                  in_wf_dir = p.replace(os.sep, "/").startswith(".github/workflows/")
                  if (low in ("action.yml", "action.yaml") and n not in ("action.yml", "action.yaml")) \
                          or (in_wf_dir and low.endswith((".yml", ".yaml")) and not n.endswith((".yml", ".yaml"))):
                      # A Windows or macOS runner finds `Action.yml` for
                      # `uses: ./dir`, but neither this step nor zizmor
                      # collects a name that is not all lowercase: fail closed.
                      print(f"::error file={prop(p)},title=action pins::{esc(p)} is a workflow or action manifest whose name is not lowercase; rename it so it can be checked")
                      sys.exit(1)
                  in_wf = in_wf_dir and n.endswith((".yml", ".yaml"))
                  if not (in_wf or n in ("action.yml", "action.yaml")):
                      continue
                  if os.path.islink(p):
                      # Not followed (it could point outside the checkout), so
                      # its pins cannot be checked: fail closed.
                      print(f"::error file={prop(p)},title=action pins::{esc(p)} is a symlink; workflow and action manifests must be regular files to be checked")
                      sys.exit(1)
                  files.append(p)
          pins = {}  # (owner, repo, sha, subpath) -> [file]; subpath is "" for a root action
          uppercase = []  # (file, uses value) pinned with uppercase hex
          noncanon = []  # (file, uses value) with a path part that is not plain (see below)
          for p in sorted(files):
              try:
                  # "./" + p: a PR-controlled directory named like an option
                  # (`--foo=x/action.yml`) must reach yq as a file, not a flag.
                  # stdin is closed so yq can never parse it instead.
                  res = subprocess.run(["yq", "-o=json", "-I=0", "explode(.)", "./" + p],
                                       stdin=subprocess.DEVNULL,
                                       capture_output=True, text=True, timeout=60)
              except (subprocess.SubprocessError, OSError) as exc:
                  print(f"::error title=action pins::scanner error: cannot run yq on {esc(p)} ({esc(exc)}); not a findings result")
                  sys.exit(2)
              if res.returncode != 0:
                  print(f"::error file={prop(p)},title=action pins::scanner error: yq cannot parse {esc(p)} ({esc(res.stderr.strip()[:300])}); not a findings result")
                  sys.exit(2)
              for doc in res.stdout.splitlines():
                  if not doc.strip():
                      continue
                  try:
                      parsed = json.loads(doc)
                  except ValueError as exc:
                      print(f"::error file={prop(p)},title=action pins::scanner error: unreadable yq output ({esc(exc)}); not a findings result")
                      sys.exit(2)
                  for value in uses_values(parsed):
                      if "@" not in value:
                          continue
                      name, ref = value.rsplit("@", 1)
                      if name.startswith(("./", "docker://")) or not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
                          continue  # local, container, or not a SHA (zizmor gates unpinned refs)
                      if ref != ref.lower():
                          # zizmor 1.32.0 compares a SHA pin with tag commits
                          # case-sensitively, so an uppercase pin matches no
                          # tag and no advisory is ever looked up for it.
                          uppercase.append((p, value))
                      ref = ref.lower()  # git ls-remote prints lowercase object IDs
                      parts = name.split("/")
                      if len(parts) < 2:
                          continue
                      if not all(re.fullmatch(r"[A-Za-z0-9_.-]*[A-Za-z0-9_-]", s_) for s_ in parts):
                          # The runner drops empty and `.` path parts, and a
                          # Windows runner drops a trailing dot, so
                          # `owner/repo/a/./b` and `owner/repo/a./b` run
                          # `owner/repo/a/b`, but no advisory name matches the
                          # spelling as written. Only plain path parts pass.
                          noncanon.append((p, value))
                          continue
                      where = pins.setdefault((parts[0], parts[1], ref, "/".join(parts[2:])), [])
                      if p not in where:
                          where.append(p)
          import base64, urllib.error, urllib.parse, urllib.request
          git_env = {**os.environ, "GIT_TERMINAL_PROMPT": "0"}
          token = os.environ.get("GH_TOKEN", "")
          if token:
              basic = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              print(f"::add-mask::{basic}")
              git_env.update({"GIT_CONFIG_COUNT": "1",
                              "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                              "GIT_CONFIG_VALUE_0": f"AUTHORIZATION: basic {basic}"})
          tags, canon, repo_ids = {}, {}, {}
          records = []  # handed to the advisory step below
          upper_pins, untagged, wrong_name = set(), set(), set()
          for p, value in uppercase:
              upper_pins.add(value)
              print(f"::error file={prop(p)},title=action pins::{esc(value)} is pinned with uppercase hex. zizmor matches a pin to its release tag case-sensitively, so no advisory can be matched to it. Pin the lowercase SHA.")
          for p, value in noncanon:
              print(f"::error file={prop(p)},title=action pins::{esc(value)} has a path part that is empty, `.` or `..`, ends in a dot, or uses a character other than letters, digits, `_`, `-` and `.`. The runner may resolve it to another path, which no advisory name would match as written. Write the plain owner/repo/path.")
          for (owner, repo, sha, subpath), where in sorted(pins.items()):
              key = (owner, repo)
              if key not in canon:
                  # zizmor 1.32.0 sends `owner/repo@version` to the advisory
                  # API as written, and the API matches the name case-
                  # sensitively: `ACTIONS/download-artifact@v4.1.2` returns
                  # nothing, `actions/download-artifact@v4.1.2` returns
                  # GHSA-cxww-7g56-2vh6. GitHub runs the action whatever the
                  # case, so the name must be written exactly as the
                  # repository's full_name, which is how the advisory database
                  # records it (`Azure/setup-kubectl`, not `azure/...`). A
                  # renamed repository redirects, so its old name fails too.
                  req = urllib.request.Request(
                      "https://api.github.com/repos/" + urllib.parse.quote(owner, safe="")
                      + "/" + urllib.parse.quote(repo, safe=""),
                      headers={"Accept": "application/vnd.github+json", "User-Agent": "action-pin-check",
                               **({"Authorization": f"Bearer {token}"} if token else {})})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          info = json.load(resp)
                      full = info.get("full_name") if isinstance(info, dict) else None
                      rid = info.get("id") if isinstance(info, dict) else None
                      if not isinstance(full, str) or type(rid) is not int:
                          raise ValueError("no full_name or id in the response")
                  except (urllib.error.URLError, OSError, ValueError) as exc:
                      print(f"::error title=action pins::scanner error: cannot look up the repository {esc(owner)}/{esc(repo)} ({esc(exc)}); not a findings result")
                      sys.exit(2)
                  canon[key] = full
                  repo_ids[key] = rid
              if canon[key] != f"{owner}/{repo}":
                  wrong_name.add(key)
                  for p in where:
                      print(f"::error file={prop(p)},title=action pins::{esc(owner)}/{esc(repo)}@{sha} does not spell the repository as GitHub does ({esc(canon[key])}). The advisory lookup matches the name exactly, so no advisory can be matched to it. Write {esc(canon[key])}.")
              if key not in tags:
                  try:
                      out = subprocess.run(
                          ["git", "ls-remote", "--tags", f"https://github.com/{owner}/{repo}.git"],
                          capture_output=True, text=True, timeout=60, check=True,
                          env=git_env).stdout
                  except (subprocess.SubprocessError, OSError) as exc:
                      print(f"::error title=action pins::scanner error: cannot list the tags of {esc(owner)}/{esc(repo)} ({esc(exc)}); not a findings result")
                      sys.exit(2)
                  # An annotated tag prints two lines: the tag object, then the
                  # commit it points at (`<tag>^{}`). Only commits can be pinned,
                  # so accept the peeled commit; a lightweight tag has one line.
                  direct, peeled = {}, {}
                  for l in out.splitlines():
                      fields = l.split()
                      if len(fields) < 2:
                          continue
                      oid, name_ = fields[0], fields[1]
                      if name_.endswith("^{}"):
                          peeled[name_[:-3]] = oid
                      else:
                          direct[name_] = oid
                  # zizmor queries advisories by ONE tag on the pinned commit
                  # (chosen below), so that tag must be a release tag (v1, v1.2, 1.2.3,
                  # v2.0.0-rc.1+build.5). A commit whose longest tag is, say,
                  # `scratch-build` would match no version range even if it
                  # also carries v1.2.3. Path-prefixed tags (save/v4.1.2, used
                  # by some monorepo actions) are rejected on purpose: zizmor
                  # sends the prefixed name to the advisory database, which
                  # matches nothing, so such a pin would never be checked.
                  release = re.compile(r"v?\d+(?:\.\d+){0,3}(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", re.ASCII)
                  by_commit = {}
                  for n_, oid in direct.items():
                      by_commit.setdefault(peeled.get(n_, oid), []).append(n_[len("refs/tags/"):])
                  tags[key] = by_commit
              names = tags[key].get(sha, [])
              # Which tag zizmor queries (zizmor 1.32.0, best_tag_for_commit):
              # for a root action (owner/repo@sha) it prefers unprefixed tags;
              # for a sub-action (owner/repo/path@sha) it prefers tags that
              # start with the subpath or its last directory. Then the longest.
              # A preferred sub-action tag is path-prefixed, which the advisory
              # database never matches, so the release check below rejects it.
              if not subpath:
                  chosen = [n_ for n_ in names if "/" not in n_] or names
              else:
                  leaf = subpath.rsplit("/", 1)[-1]
                  chosen = [n_ for n_ in names if n_.startswith((subpath + "/", leaf + "/"))] or names
              # Ties: zizmor may pick any of the equally long tags, so every
              # one of them must be a release tag.
              # Length in UTF-8 bytes, as zizmor (Rust str::len) measures it.
              blen = lambda s: len(s.encode("utf-8"))
              top = max((blen(n_) for n_ in chosen), default=0)
              if not (chosen and all(release.fullmatch(n_) for n_ in chosen if blen(n_) == top)):
                  untagged.add((owner, repo, sha, subpath))
                  for p in where:
                      print(f"::error file={prop(p)},title=action pins::{esc(owner)}/{esc(repo)}@{sha} is not a release-tagged commit of {esc(owner)}/{esc(repo)} (no tag, or the tag zizmor would query is not a plain version such as v1.2.3), so no advisory can be matched to it. Pin the SHA of a released version.")
              # The pin's versions for the advisory step: its release tags
              # with the most version parts (v4.3.0, not the floating v4 on
              # the same commit, which the advisory API reads as 4.0.0).
              rel = [n_ for n_ in names if release.fullmatch(n_)]
              depth = lambda t: len(re.split(r"[-+]", t, maxsplit=1)[0].split("."))
              most = max((depth(t) for t in rel), default=0)
              records.append({"owner": owner, "repo": repo, "full_name": canon[key], "id": repo_ids[key],
                              "subpath": subpath, "sha": sha, "files": where,
                              "versions": sorted(t for t in rel if depth(t) == most)})
          try:
              with open(os.path.join(os.environ["RUNNER_TEMP"], "action-pins.json"), "x", encoding="utf-8") as fh:
                  json.dump(records, fh)
          except (KeyError, OSError) as exc:
              print(f"::error title=action pins::scanner error: cannot hand the pins to the advisory step ({esc(exc)}); not a findings result")
              sys.exit(2)
          print(f"action pins: {len(pins)} distinct SHA pins checked; rejected: {len(upper_pins)} written in uppercase hex, "
                f"{len(noncanon)} with a path that is not plain, "
                f"{len(wrong_name)} repositories not spelled as GitHub does, {len(untagged)} not a tagged release")
          sys.exit(1 if upper_pins or noncanon or untagged or wrong_name else 0)
          PY
      # zizmor 1.32.0 looks up advisories for step actions only, under the
      # name as written. It misses advisories against reusable workflows
      # (jobs.<id>.uses), advisories filed under a sub-action's own path
      # (owner/repo/sub/path, sometimes as a https://github.com/... URL), and
      # advisories filed under a repository's name before a rename or
      # transfer. This step reads every reviewed advisory in the `actions`
      # ecosystem, resolves the repository each one names to its ID (GitHub
      # redirects an old name to the repository's current ID), and asks the
      # advisory API whether each pin's release version is in the vulnerable
      # range, under every name that resolves to the pin's repository.
      - name: Advisories against reusable workflows, sub-action paths and renamed repositories
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}  # see the zizmor step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # -I: see the zizmor step; the working directory is the PR's checkout.
          python3 -I - <<'PY'
          import http.client, json, os, re, sys, time, urllib.error, urllib.parse, urllib.request

          API = "https://api.github.com"

          def esc(s):
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def prop(s):
              return esc(s).replace(",", "%2C").replace(":", "%3A")

          def fail(msg):
              print(f"::error title=action advisories::scanner error: {esc(msg)}; not a findings result")
              sys.exit(2)

          def crashed(kind, exc, tb):
              # An uncaught exception would exit 1, the findings code.
              print(f"::error title=action advisories::scanner error: {esc(kind.__name__)} ({esc(exc)}); not a findings result", flush=True)
              os._exit(2)
          sys.excepthook = crashed

          token = os.environ.get("GH_TOKEN", "")
          if not token:
              fail("no GitHub token, so the advisory lookup cannot run")
          HEADERS = {"Accept": "application/vnd.github+json", "User-Agent": "action-advisory-check",
                     "X-GitHub-Api-Version": "2022-11-28", "Authorization": f"Bearer {token}"}

          class SameHost(urllib.request.HTTPRedirectHandler):
              # GitHub redirects a renamed repository within the API host;
              # anything else would carry the token elsewhere.
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not newurl.startswith(API + "/"):
                      fail(f"redirect away from {API} ({newurl[:200]})")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          OPENER = urllib.request.build_opener(SameHost)

          def next_link(link):
              # The rel="next" URL of a Link header, wherever its parameters sit.
              nxt = None
              for m in re.finditer(r'<([^>]*)>([^<]*)', link):
                  rels = re.findall(r';\s*rel\s*=\s*"?([^";,]*)', m.group(2), flags=re.I)
                  if any("next" in r.lower().split() for r in rels):
                      if nxt is not None or not m.group(1).startswith(API + "/"):
                          fail(f"unexpected pagination link ({link[:300]})")
                      nxt = m.group(1)
              if nxt is None and re.search(r"\bnext\b", re.sub(r"<[^>]*>", "", link), flags=re.I):
                  fail(f"unreadable pagination link ({link[:300]})")
              return nxt

          MISSING = object()  # not JSON null: a 200 with `null` is not a 404

          def get(url, missing_ok=False):
              # Returns the decoded JSON and the next page's URL, or (MISSING,
              # None) for a repository that does not exist when missing_ok.
              # A dropped connection, a truncated body or a 5xx is retried
              # twice; anything else, or a third failure, is a scanner error.
              for attempt in (1, 2, 3):
                  req = urllib.request.Request(url, headers=HEADERS)
                  try:
                      with OPENER.open(req, timeout=60) as resp:
                          data = json.load(resp)
                          link = resp.headers.get("Link", "")
                      return data, next_link(link)
                  except urllib.error.HTTPError as exc:
                      if missing_ok and exc.code in (404, 451):
                          return MISSING, None
                      if exc.code not in (500, 502, 503, 504) or attempt == 3:
                          fail(f"GET {url} returned HTTP {exc.code}")
                  except (urllib.error.URLError, OSError, http.client.IncompleteRead) as exc:
                      if attempt == 3:
                          fail(f"GET {url} failed ({exc})")
                  except ValueError as exc:
                      fail(f"GET {url} returned unreadable JSON ({exc})")
                  time.sleep(5 * attempt)

          def vulns_of(adv):
              # Every advisory must carry the fields this step reads, or a
              # malformed one could drop a name (a clean pass) or be reported
              # as a finding.
              ok = (isinstance(adv, dict) and isinstance(adv.get("ghsa_id"), str)
                    and re.fullmatch(r"GHSA(-[0-9a-z]{4}){3}", adv["ghsa_id"])
                    and (adv.get("withdrawn_at") is None
                         or isinstance(adv["withdrawn_at"], str)
                         and re.match(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d", adv["withdrawn_at"]))
                    and isinstance(adv.get("vulnerabilities"), list)
                    and all(isinstance(v, dict) and isinstance(v.get("package"), dict)
                            and isinstance(v["package"].get("name"), str)
                            and isinstance(v["package"].get("ecosystem"), str)
                            for v in adv["vulnerabilities"]))
              if not ok:
                  fail(f"an advisory without the expected fields ({str(adv)[:200]})")
              for v in adv["vulnerabilities"]:
                  name = v["package"]["name"]
                  if v["package"]["ecosystem"] == "actions" and (not split_name(name) or "," in name or "@" in name):
                      fail(f"{adv['ghsa_id']} names the action {name!r}, which this step cannot query")
              return adv["vulnerabilities"]

          def get_all(url):
              out, pages = [], 0
              while url:
                  data, url = get(url)
                  if not isinstance(data, list):
                      fail("the advisory API did not return a list of advisories")
                  for adv in data:
                      vulns_of(adv)
                  out += data
                  pages += 1
                  if pages > 200:
                      fail("more than 200 pages of advisories")
              return out

          try:
              with open(os.path.join(os.environ["RUNNER_TEMP"], "action-pins.json"), encoding="utf-8") as fh:
                  pins = json.load(fh)
              if not isinstance(pins, list):
                  raise ValueError("not a list")
          except (KeyError, OSError, ValueError) as exc:
              fail(f"no pin list from the pin step, which stopped before writing it ({exc})")
          for x in pins:
              if not (isinstance(x, dict) and type(x.get("id")) is int
                      and all(isinstance(x.get(k), str) and x[k] for k in ("owner", "repo", "full_name", "sha"))
                      and isinstance(x.get("subpath"), str)
                      and isinstance(x.get("files"), list) and x["files"] and all(isinstance(f, str) for f in x["files"])
                      and isinstance(x.get("versions"), list) and all(isinstance(v, str) and v for v in x["versions"])):
                  fail(f"a malformed pin record ({str(x)[:200]})")

          def split_name(n):
              # owner/repo[/path] or https://github.com/owner/repo[/path]
              s = re.sub(r"^(?:https?://)?(?:www\.)?github\.com/", "", n.strip(), flags=re.I).strip("/")
              parts = s.split("/")
              if len(parts) >= 2:
                  parts[1] = re.sub(r"\.git$", "", parts[1])
              # Plain parts only, as the pin step requires of a `uses:` path,
              # so an advisory name can never be a spelling the pin cannot be.
              if len(parts) < 2 or not all(re.fullmatch(r"[A-Za-z0-9_.-]*[A-Za-z0-9_-]", x) for x in parts):
                  return None
              return parts[0], parts[1], "/".join(parts[2:])

          # Every advisory package name in the actions ecosystem, and the ID of
          # the repository it names. GET /repos/{old name} redirects to the
          # repository's current ID after a rename or transfer.
          advisories = get_all(f"{API}/advisories?ecosystem=actions&per_page=100")
          by_id, by_name, resolved = {}, {}, {}
          for adv in advisories:
              for v in vulns_of(adv):
                  name = v["package"]["name"]
                  if v["package"]["ecosystem"] != "actions":
                      continue
                  owner, repo, sub = split_name(name)
                  key = (owner.lower(), repo.lower())
                  if key not in resolved:
                      info, _ = get(f"{API}/repos/{urllib.parse.quote(owner, safe='')}/{urllib.parse.quote(repo, safe='')}",
                                    missing_ok=True)
                      if info is not MISSING and (not isinstance(info, dict) or type(info.get("id")) is not int):
                          fail(f"no repository ID for {owner}/{repo}")
                      resolved[key] = None if info is MISSING else info["id"]
                  if resolved[key] is not None:
                      by_id.setdefault(resolved[key], set()).add((name, sub.lower()))
                  # A name that no longer resolves still matches as written.
                  by_name.setdefault(key, set()).add((name, sub.lower()))

          hits, unchecked = set(), set()
          for pin in pins:
              owner, repo, full, rid = pin["owner"], pin["repo"], pin["full_name"], pin["id"]
              sub = pin["subpath"].strip("/")
              shown = f"{owner}/{repo}{'/' + sub if sub else ''}@{pin['sha']}"
              if not pin["versions"]:
                  # The pin step already rejects it as not a tagged release.
                  unchecked.add(shown)
                  for p in pin["files"]:
                      print(f"::error file={prop(p)},title=action advisories::{esc(shown)} has no release version, so no advisory can be checked for it (see the pin step).")
                  continue
              def applies(asub):
                  # An advisory against the repository covers all of it; one
                  # against a path covers that path and anything below it.
                  return not asub or sub.lower() == asub.strip("/") or sub.lower().startswith(asub.strip("/") + "/")
              names = {f"{owner}/{repo}", full}
              if sub:
                  names |= {f"{owner}/{repo}/{sub}", f"{full}/{sub}", f"https://github.com/{full}/{sub}"}
              for key in {(owner.lower(), repo.lower()), tuple(full.lower().split("/", 1))}:
                  names |= {n for n, s in by_name.get(key, ()) if applies(s)}
              names |= {n for n, s in by_id.get(rid, ()) if applies(s)}
              for version in pin["versions"]:
                  affects = ",".join(sorted(f"{n}@{version}" for n in names))
                  found = get_all(f"{API}/advisories?" + urllib.parse.urlencode(
                      {"ecosystem": "actions", "affects": affects, "per_page": "100"}))
                  for adv in found:
                      ghsa = adv["ghsa_id"]
                      if adv["withdrawn_at"] or (ghsa, shown) in hits:
                          continue
                      matched = [v for v in adv["vulnerabilities"]
                                 if v["package"]["ecosystem"] == "actions" and v["package"]["name"] in names]
                      if not matched:
                          fail(f"{ghsa} was returned for {affects} but names none of those actions")
                      ranges = "; ".join(f"{v['package']['name']} {v.get('vulnerable_version_range')}" for v in matched)
                      hits.add((ghsa, shown))
                      for p in pin["files"]:
                          print(f"::error file={prop(p)},title=action advisories::{esc(shown)} is release {esc(version)}, "
                                f"which {esc(ghsa)} marks vulnerable ({esc(ranges)}): {esc(adv.get('summary', ''))}. "
                                f"Pin a fixed release.")
          print(f"action advisories: {len(advisories)} reviewed advisories in the actions ecosystem, "
                f"{len(resolved)} repositories named, {sum(1 for v in resolved.values() if v is None)} no longer exist; "
                f"{len(pins)} pins, {len(unchecked)} without a release version, {len(hits)} findings")
          sys.exit(1 if hits or unchecked else 0)
          PY

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 2: on a pull_request the checkout is a merge commit whose
          # first parent (HEAD^1) is the base branch, used below.
          fetch-depth: 2
      # Both of npm's lockfile names count, and removing the lockfile is not a
      # way to skip the check: if the base branch has one at the root and the
      # PR does not, the job fails instead of skipping.
      - name: Find the npm lockfile
        id: lock
        run: |
          set -eu
          for f in package-lock.json npm-shrinkwrap.json; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            for f in package-lock.json npm-shrinkwrap.json; do
              if git cat-file -e "HEAD^1:$f" 2>/dev/null; then
                echo "::error title=npm audit::the base branch has $f at the repo root and this PR removes or replaces it; the npm checks cannot be skipped that way"
                exit 1
              fi
            done
          fi
          echo "::notice title=npm audit::no package-lock.json or npm-shrinkwrap.json at the repo root; skipped"
          echo "present=false" >> "$GITHUB_OUTPUT"
      # A pull request controls the project .npmrc, and npm settings decide
      # what the audit covers (`omit=dev` hides dev dependencies, `registry=`
      # picks who answers). So on a PR, npm runs with the BASE branch's
      # .npmrc. The PR's copy is deleted first (rm removes a symlink, not its
      # target), so the write below cannot be redirected.
      - name: Use the base branch's .npmrc
        if: steps.lock.outputs.present == 'true' && github.event_name == 'pull_request'
        run: |
          set -eu
          if ! git diff --quiet HEAD^1 HEAD -- .npmrc; then
            echo "::warning title=npm audit::this PR changes .npmrc; auditing with the base branch's copy"
          fi
          rm -rf -- .npmrc
          mode=$(git ls-tree HEAD^1 -- .npmrc | cut -d' ' -f1)
          case "$mode" in
            100644|100755) git cat-file blob "HEAD^1:.npmrc" > .npmrc ;;
          esac
      # setup-node reads the Node version from .nvmrc and, without one, fails
      # with an error that does not say what is missing.
      - name: Check for .nvmrc
        if: steps.lock.outputs.present == 'true'
        run: |
          if [ ! -f .nvmrc ]; then
            echo "::error file=.nvmrc,title=npm audit::.nvmrc is missing at the repo root. The npm jobs read the Node version from it; commit one with an LTS major, e.g. 'echo 24 > .nvmrc'"
            exit 1
          fi
      - if: steps.lock.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # npm audit reads the lockfile; no install, so no lifecycle scripts run.
      # The --include flags audit every dependency type whatever the config
      # says. npm's exit code is ignored on purpose: the JSON decides.
      # Exit 1 means findings and nothing else. Every scanner error exits 2
      # with a message that says so: output that is empty or not JSON, or a
      # result without metadata (a registry or network failure). Neither is
      # a clean scan.
      - name: npm audit (high+), findings vs scanner error
        if: steps.lock.outputs.present == 'true'
        run: |
          set -u
          npm_rc=0
          npm audit --audit-level=high --include=dev --include=optional --include=peer --json > "$RUNNER_TEMP/audit.json" || npm_rc=$?
          # shellcheck disable=SC2016  # the single-quoted body is JavaScript, not shell
          AUDIT_JSON="$RUNNER_TEMP/audit.json" NPM_RC="$npm_rc" node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(process.env.AUDIT_JSON, "utf8");
            let d;
            try {
              d = JSON.parse(raw);
            } catch (e) {
              console.log(`::error title=npm audit::scanner error: npm audit (exit ${process.env.NPM_RC}) wrote ${raw.trim() ? "output that is not JSON" : "no output"}; not a findings result`);
              if (raw.trim()) console.log(raw.slice(0, 400));
              process.exit(2);
            }
            if (!d || typeof d !== "object" || !d.metadata || !d.metadata.vulnerabilities) {
              console.log(`::error title=npm audit::scanner error: no audit result (registry or network failure, npm exit ${process.env.NPM_RC}); not a findings result`);
              console.log(JSON.stringify(d).slice(0, 400));
              process.exit(2);
            }
            const v = d.metadata.vulnerabilities;
            console.log("npm audit:", JSON.stringify(v));
            const n = (v.high || 0) + (v.critical || 0);
            if (n === 0) process.exit(0);
            console.log(`::error title=npm audit::${n} high/critical findings (critical ${v.critical || 0}, high ${v.high || 0})`);
            process.exit(1);
          '

  npm-signatures:
    name: npm audit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Same lockfile and .npmrc handling as the npm audit job, for the same
      # reasons; see the comments there.
      - name: Find the npm lockfile
        id: lock
        run: |
          set -eu
          for f in package-lock.json npm-shrinkwrap.json; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            for f in package-lock.json npm-shrinkwrap.json; do
              if git cat-file -e "HEAD^1:$f" 2>/dev/null; then
                echo "::error title=npm audit signatures::the base branch has $f at the repo root and this PR removes or replaces it; the npm checks cannot be skipped that way"
                exit 1
              fi
            done
          fi
          echo "::notice title=npm audit signatures::no package-lock.json or npm-shrinkwrap.json at the repo root; skipped"
          echo "present=false" >> "$GITHUB_OUTPUT"
      - name: Use the base branch's .npmrc
        if: steps.lock.outputs.present == 'true' && github.event_name == 'pull_request'
        run: |
          set -eu
          if ! git diff --quiet HEAD^1 HEAD -- .npmrc; then
            echo "::warning title=npm audit signatures::this PR changes .npmrc; installing with the base branch's copy"
          fi
          rm -rf -- .npmrc
          mode=$(git ls-tree HEAD^1 -- .npmrc | cut -d' ' -f1)
          case "$mode" in
            100644|100755) git cat-file blob "HEAD^1:.npmrc" > .npmrc ;;
          esac
      - name: Check for .nvmrc
        if: steps.lock.outputs.present == 'true'
        run: |
          if [ ! -f .nvmrc ]; then
            echo "::error file=.nvmrc,title=npm audit signatures::.nvmrc is missing at the repo root. The npm jobs read the Node version from it; commit one with an LTS major, e.g. 'echo 24 > .nvmrc'"
            exit 1
          fi
      - if: steps.lock.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: install scripts are the supply-chain attack surface,
      # and a signature check does not need them to run. --include: install
      # every dependency type, so every one is checked.
      - if: steps.lock.outputs.present == 'true'
        run: npm ci --ignore-scripts --include=dev --include=optional --include=peer
      # What this does NOT cover: npm verifies signatures only for packages
      # that came from a registry. A dependency installed from a git URL, a
      # tarball URL or a local path has no registry signature and is skipped
      # silently. The next step lists those, so they are at least visible.
      - name: Registry packages have verified signatures
        if: steps.lock.outputs.present == 'true'
        # --include: verify every installed dependency type, whatever `omit`
        # the trusted .npmrc sets (the listing below assumes all are checked).
        run: npm audit signatures --include=dev --include=optional --include=peer
      # A locked dependency counts as covered only when it resolves to a .tgz
      # under the configured registry (registry.npmjs.org unless the trusted
      # .npmrc says otherwise) and has an integrity hash. Any other https host
      # is a tarball URL, not the registry, and is listed. The list needs the
      # lockfile's `packages` map (lockfileVersion 2 or 3): a v1 lockfile has
      # none, and the step fails rather than report nothing as "covered".
      # `npm audit signatures` checks the installed tree only, so a registry
      # entry npm ci did not install on this runner (an optional package for
      # another platform) is reported as not checked, not as covered. npm also
      # skips a package whose dependents declare it ONLY as a URL, git or file spec
      # (even a URL on the registry), so those are listed as not covered.
      - name: List dependencies that signatures do not cover
        if: steps.lock.outputs.present == 'true'
        run: |
          set -eu
          REGISTRY="$(npm config get registry)"
          NPM_DIR="$(npm root -g)/npm"
          export REGISTRY NPM_DIR
          # shellcheck disable=SC2016  # the single-quoted body is JavaScript, not shell
          node -e '
            const fs = require("fs");
            const T = "npm audit signatures";
            const f = fs.existsSync("npm-shrinkwrap.json") ? "npm-shrinkwrap.json" : "package-lock.json";
            let reg;
            try {
              reg = new URL(process.env.REGISTRY || "");
            } catch (e) {
              console.log(`::error title=${T}::cannot read the configured npm registry (${JSON.stringify(process.env.REGISTRY)}); not a coverage result`);
              process.exit(2);
            }
            if (reg.protocol !== "https:") {
              console.log(`::error title=${T}::the configured npm registry ${reg.href} is not https`);
              process.exit(1);
            }
            const prefix = reg.origin + (reg.pathname.endsWith("/") ? reg.pathname : reg.pathname + "/");
            let lock;
            try {
              lock = JSON.parse(fs.readFileSync(f, "utf8"));
            } catch (e) {
              console.log(`::error file=${f},title=${T}::${f} is not valid JSON (${e.message}); not a coverage result`);
              process.exit(2);
            }
            const pkgs = lock && lock.packages;
            if (!pkgs || typeof pkgs !== "object" || Array.isArray(pkgs)) {
              console.log(`::error file=${f},title=${T}::${f} has no "packages" map (lockfileVersion ${lock && lock.lockfileVersion}), so the dependencies outside signature coverage cannot be listed. Regenerate it with npm 7 or later: npm install --package-lock-only`);
              process.exit(1);
            }
            // Workflow-command escaping: paths and URLs come from the lockfile, which a PR controls.
            // (No apostrophes in this script: it is one single-quoted shell argument.)
            const esc = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            // Which installed packages did npm audit signatures verify? Rather
            // than re-derive it from the lockfile (overrides, field precedence,
            // workspaces and optional platform packages all change the answer),
            // ask the same code npm uses: load the installed tree with the
            // Arborist and npm-package-arg bundled in this npm, and apply the
            // edge filter from npm lib/utils/verify-signatures.js (a valid spec,
            // an installed version, not a workspace, and spec.registry).
            (async () => {
              let Arborist, npa;
              try {
                Arborist = require(process.env.NPM_DIR + "/node_modules/@npmcli/arborist");
                npa = require(process.env.NPM_DIR + "/node_modules/npm-package-arg");
              } catch (e) {
                console.log(`::error title=${T}::cannot load the Arborist bundled with npm from ${esc(process.env.NPM_DIR)} (${esc(e.message)}); not a coverage result`);
                process.exit(2);
              }
              let tree;
              try {
                tree = await new Arborist({ path: process.cwd() }).loadActual();
              } catch (e) {
                console.log(`::error title=${T}::cannot load the installed tree (${esc(e.message)}); not a coverage result`);
                process.exit(2);
              }
              const specOf = (edge) => {
                let name = edge.name;
                try { name = npa(edge.spec).subSpec.name; } catch (e) { /* keep edge.name */ }
                try { return npa(`${name}@${edge.spec}`); } catch (e) { return null; }
              };
              // Locations as lockfile keys (forward slashes on every OS).
              const loc = (node) => node.location.split(String.fromCharCode(92)).join("/");
              const inv = new Map([...tree.inventory.values()].map((node) => [loc(node), node]));
              const verified = new Set();
              for (const node of tree.inventory.values()) {
                for (const edge of node.edgesOut.values()) {
                  const to = edge.to;
                  const spec = specOf(edge);
                  if (!to || !spec || !spec.registry || to.isWorkspace || !(to.package || {}).version) continue;
                  verified.add(loc(to));
                }
              }
              let n = 0, covered = 0, notVerified = 0;
              const absent = [];
              for (const [path, p] of Object.entries(pkgs)) {
                // Skip the root, links, and workspace packages (entries outside
                // node_modules): those are source code of this repository.
                if (!path || !p || p.link || !path.includes("node_modules/")) continue;
                const r = p.resolved || "";
                let ok = false;
                try {
                  const u = new URL(r);
                  ok = u.protocol === "https:" && (u.origin + u.pathname).startsWith(prefix) && u.pathname.endsWith(".tgz");
                } catch (e) { ok = false; }
                if (!ok || !p.integrity) {
                  // Counted as not covered only when installed here; an absent
                  // one still gets the warning but is counted as not checked.
                  if (inv.has(path)) n++; else absent.push(path);
                  console.log(`::warning title=${T}::${esc(path)} does not come from the registry ${esc(prefix)} with an integrity hash (${esc(r || "no resolved URL")}); its signature is not verified`);
                } else if (!inv.has(path)) {
                  // npm audit signatures checks the INSTALLED tree only, so a
                  // registry entry that npm ci did not install here (an optional
                  // package for another platform) was not verified on this runner.
                  absent.push(path);
                } else if (!verified.has(path)) {
                  notVerified++;
                  const specs = [...inv.get(path).edgesIn].map((e) => e.spec);
                  console.log(`::warning title=${T}::${esc(path)} is not reached through a registry spec (its dependents declare: ${esc(specs.join(", ") || "nothing")}), so npm audit signatures does not verify it`);
                } else {
                  covered++;
                }
              }
              if (absent.length) {
                const shown = absent.slice(0, 10).map(esc).join(", ");
                console.log(`::notice title=${T}::${absent.length} dependencies in the lockfile were not installed on this runner (usually optional packages for another platform), so their signatures were not verified here: ${shown}${absent.length > 10 ? ", ..." : ""}`);
              }
              console.log(`${covered} installed registry dependencies covered by the signature check above; ${n} not from the registry ${prefix} or missing an integrity hash (not covered); ${notVerified} not reached through a registry spec (not covered); ${absent.length} not installed here (not checked)`);
            })().catch((e) => {
              console.log(`::error title=${T}::coverage listing failed (${esc(e && e.message)}); not a coverage result`);
              process.exit(2);
            });
          '
